name: Semgrep Security Scan

on:
  pull_request:
    paths:
      - "examples/**"
      - "naive/**"

permissions:
  contents: read

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST Scan
        run: semgrep scan --config p/c p/security-audit p/owasp-top-ten p/golang p/cwe-top-25
